name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: ./mvnw --batch-mode test

  build-image:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest

      - name: Build image with Spring Boot Buildpacks
        run: |
          # Build image with first tag
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Building image: $FIRST_TAG"

          ./mvnw --batch-mode spring-boot:build-image \
            -Dspring-boot.build-image.imageName=$FIRST_TAG

      - name: Tag and push all tags
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)

          # Push first tag (already built)
          echo "Pushing: $FIRST_TAG"
          docker push $FIRST_TAG

          # Tag and push additional tags
          echo "${{ steps.meta.outputs.tags }}" | tail -n +2 | while read TAG; do
            if [ -n "$TAG" ]; then
              echo "Tagging and pushing: $TAG"
              docker tag $FIRST_TAG $TAG
              docker push $TAG
            fi
          done

      - name: Output image tags
        run: |
          echo "### Docker Images Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | while read TAG; do
            echo "- \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          done
