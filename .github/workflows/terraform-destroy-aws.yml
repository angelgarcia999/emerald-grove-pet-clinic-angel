name: Terraform Destroy AWS

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm deletion of all AWS infrastructure'
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  TF_WORKING_DIR: ./terraform

jobs:
  validate-confirmation:
    name: Validate Destroy Confirmation
    runs-on: ubuntu-latest
    outputs:
      confirmed: ${{ steps.check.outputs.confirmed }}

    steps:
      - name: Check confirmation
        id: check
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" = "destroy" ]; then
            echo "confirmed=true" >> $GITHUB_OUTPUT
          else
            echo "confirmed=false" >> $GITHUB_OUTPUT
            echo "::error::Destroy not confirmed. You must type 'destroy' exactly to proceed."
            exit 1
          fi

  terraform-destroy:
    name: Destroy AWS Infrastructure
    runs-on: ubuntu-latest
    needs: validate-confirmation
    if: needs.validate-confirmation.outputs.confirmed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.6'

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy \
            -var="db_password=${{ secrets.TF_DB_PASSWORD }}" \
            -auto-approve

      - name: Destroy complete
        run: |
          echo "### ✅ AWS Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All AWS resources have been successfully deleted." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Destroyed resources:**" >> $GITHUB_STEP_SUMMARY
          echo "- ECS Cluster, Service, and Tasks" >> $GITHUB_STEP_SUMMARY
          echo "- Application Load Balancer" >> $GITHUB_STEP_SUMMARY
          echo "- RDS PostgreSQL Database" >> $GITHUB_STEP_SUMMARY
          echo "- Security Groups" >> $GITHUB_STEP_SUMMARY
          echo "- CloudWatch Logs" >> $GITHUB_STEP_SUMMARY
          echo "- IAM Roles and Policies" >> $GITHUB_STEP_SUMMARY
