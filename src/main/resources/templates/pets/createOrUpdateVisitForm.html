<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    <th:block th:if="${visit['new']}" th:text="#{new}">New </th:block>
    Visit
  </h2>

  <b th:text="#{pet}">Pet</b>
  <table class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{name}">Name</th>
        <th th:text="#{birthDate}">Birth Date</th>
        <th th:text="#{type}">Type</th>
        <th th:text="#{owner}">Owner</th>
      </tr>
    </thead>
    <tr>
      <td th:text="${pet.name}"></td>
      <td th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></td>
      <td th:text="${pet.type}"></td>
      <td th:text="${owner?.firstName + ' ' + owner?.lastName}"></td>
    </tr>
  </table>

  <form th:object="${visit}" class="form-horizontal" method="post">
    <div class="form-group has-feedback">
      <input th:replace="~{fragments/inputField :: input ('Date', 'date', 'date')}" />
      <input th:replace="~{fragments/inputField :: input ('Description', 'description', 'text')}" />

      <!-- Appointment Time Selection -->
      <div class="control-group" th:with="valid=${!#fields.hasErrors('startTime')}">
        <label class="control-label" th:text="'Appointment Time'">Appointment Time</label>
        <div class="controls">
          <select th:field="*{startTime}" th:class="${!valid} ? 'is-invalid' : ''">
            <option value="">Select a time</option>
            <option value="09:00">9:00 AM</option>
            <option value="09:30">9:30 AM</option>
            <option value="10:00">10:00 AM</option>
            <option value="10:30">10:30 AM</option>
            <option value="11:00">11:00 AM</option>
            <option value="11:30">11:30 AM</option>
            <option value="12:00">12:00 PM</option>
            <option value="12:30">12:30 PM</option>
            <option value="13:00">1:00 PM</option>
            <option value="13:30">1:30 PM</option>
            <option value="14:00">2:00 PM</option>
            <option value="14:30">2:30 PM</option>
            <option value="15:00">3:00 PM</option>
            <option value="15:30">3:30 PM</option>
            <option value="16:00">4:00 PM</option>
            <option value="16:30">4:30 PM</option>
            <option value="17:00">5:00 PM</option>
          </select>
          <span th:if="${!valid}" class="help-inline" th:errors="*{startTime}">Error</span>
        </div>
      </div>

      <!-- Veterinarian Selection -->
      <div class="control-group" th:with="valid=${!#fields.hasErrors('vet')}">
        <label class="control-label" th:text="'Veterinarian'">Veterinarian</label>
        <div class="controls">
          <select th:field="*{vet.id}" th:class="${!valid} ? 'is-invalid' : ''">
            <option value="">Select a veterinarian</option>
            <option th:each="vet : ${vets}" th:value="${vet.id}">
              <span th:text="'Dr. ' + ${vet.lastName}">Dr. Smith</span>
              <span th:if="${!vet.specialties.empty}" th:text="' (' + ${#strings.listJoin(vet.specialties, ', ')} + ')'">(Specialties)</span>
            </option>
          </select>
          <span th:if="${!valid}" class="help-inline" th:errors="*{vet}">Error</span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <input type="hidden" name="petId" th:value="${pet.id}" />
        <button class="btn btn-primary" type="submit" th:text="#{addVisit}">Add Visit</button>
      </div>
    </div>
  </form>

  <br />
  <b th:text="#{previousVisits}">Previous Visits</b>
  <table class="table table-striped">
    <tr>
      <th th:text="#{date}">Date</th>
      <th th:text="#{description}">Description</th>
    </tr>
    <tr th:if="${!visit['new']}" th:each="visit : ${pet.visits}">
      <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
      <td th:text=" ${visit.description}"></td>
    </tr>
  </table>

</body>

</html>
