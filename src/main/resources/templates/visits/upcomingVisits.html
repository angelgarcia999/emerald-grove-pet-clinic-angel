<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'visits')}">

<body>

  <section class="liatrio-section">
    <div class="liatrio-table-card">
      <div class="liatrio-card-header">
        <h2 th:text="#{visits.upcoming.title}">Upcoming Visits</h2>
        <p class="liatrio-muted"
           th:text="#{visits.upcoming.showingDays(${days}, ${#temporals.format(startDate, 'yyyy-MM-dd')}, ${#temporals.format(endDate, 'yyyy-MM-dd')})}">
          Showing visits for the next 7 days
        </p>
      </div>

      <div th:if="${visits.isEmpty()}" class="liatrio-empty-state">
        <p class="liatrio-muted" th:text="#{visits.upcoming.noVisits}">No upcoming visits scheduled</p>
      </div>

      <table th:unless="${visits.isEmpty()}" id="visits" class="table table-striped liatrio-table">
        <thead>
          <tr>
            <th th:text="#{visits.upcoming.date}">Date</th>
            <th th:text="#{visits.upcoming.description}">Description</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="visit : ${visits}">
            <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
            <td th:text="${visit.description}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</body>

</html>
